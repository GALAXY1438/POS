<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
<title>TechShift POS</title>
<style>
    @font-face {
        font-family: "Inter";
        src: url("./build/InterVariable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: transparent; }
    body {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        color: #FAFAFA;
        display: flex;
        user-select: none;
        -webkit-app-region: drag;
        -webkit-font-smoothing: antialiased;
    }
    .splash {
        flex: 1;
        background: #0A0A0A;
        border: 1px solid #262626;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 0 40px;
        margin: 0;
        overflow: hidden;
    }
    /* stage view */
    .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .mark {
        width: 56px; height: 56px;
        border-radius: 14px;
        background: #FAFAFA;
        color: #0A0A0A;
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 18px;
    }
    h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #FAFAFA;
        margin: 0 0 6px;
    }
    .kicker {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #A3A3A3;
        margin-bottom: 22px;
    }
    .welcome {
        font-size: 13px;
        color: #A3A3A3;
        margin-bottom: 34px;
        min-height: 18px;
    }
    .track {
        width: 240px;
        height: 2px;
        background: #262626;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 14px;
        position: relative;
    }
    .bar {
        position: absolute;
        top: 0; left: 0;
        height: 100%;
        width: 40%;
        background: #FAFAFA;
        border-radius: 2px;
        animation: slide 1.5s ease-in-out infinite;
    }
    .bar.determinate {
        width: 0;
        animation: none;
        transition: width .35s ease;
    }
    @keyframes slide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
    }
    .status {
        font-size: 12px;
        color: #737373;
        min-height: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .status a {
        color: #A3A3A3;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        -webkit-app-region: no-drag;
    }
    .status a:hover { color: #FAFAFA; }
    .foot {
        position: absolute;
        left: 24px; right: 24px; bottom: 16px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #525252;
    }
    /* error view */
    .error-view {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
    }
    .error-view h2 {
        font-size: 18px;
        font-weight: 600;
        color: #FAFAFA;
        margin: 0 0 8px;
    }
    .error-view p {
        font-size: 13px;
        color: #A3A3A3;
        margin: 0 0 24px;
        max-width: 380px;
        line-height: 1.5;
    }
    .actions { display: flex; gap: 10px; }
    .btn {
        height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: background-color .15s ease, border-color .15s ease;
    }
    .btn-primary { background: #FAFAFA; border: 1px solid #FAFAFA; color: #0A0A0A; }
    .btn-primary:hover { background: #E5E5E5; border-color: #E5E5E5; }
    .btn-outline { background: transparent; border: 1px solid #404040; color: #FAFAFA; }
    .btn-outline:hover { border-color: #737373; }
    body.is-error .stage { display: none; }
    body.is-error .error-view { display: flex; }
</style>
</head>
<body>
    <div class="splash">
        <div class="stage">
            <div class="mark">T</div>
            <h1>TechShift POS</h1>
            <div class="kicker">Point of sale</div>
            <p class="welcome" id="welcome">Welcome. Getting your store ready.</p>

            <div class="track"><div class="bar" id="bar"></div></div>
            <p class="status"><span id="statusText">Starting database</span><a id="detailsLink" style="display:none">View details</a></p>
        </div>

        <div class="error-view">
            <h2>Couldn't start TechShift POS</h2>
            <p id="errorReason">The database or web server did not start.</p>
            <div class="actions">
                <button class="btn btn-primary" id="retryBtn">Retry</button>
                <button class="btn btn-outline" id="logsBtn">Open logs</button>
            </div>
        </div>

        <div class="foot">
            <span id="versionText">v2.0.0</span>
            <span id="yearText">&copy; 2026 TechShift</span>
        </div>
    </div>

<script>
    var statusText = document.getElementById('statusText');
    var bar = document.getElementById('bar');
    var detailsLink = document.getElementById('detailsLink');

    function setStage(text, pct) {
        statusText.textContent = text;
        if (typeof pct === 'number') {
            bar.classList.add('determinate');
            bar.style.width = pct + '%';
        }
        if (text === 'Taking longer than usual…') {
            detailsLink.style.display = 'inline';
        }
    }

    window.splash = {
        stage: function (text, pct) { setStage(text, pct); },
        welcome: function (text) { document.getElementById('welcome').textContent = text; },
        version: function (v, year) {
            if (v) document.getElementById('versionText').textContent = 'v' + v;
            if (year) document.getElementById('yearText').textContent = '\u00a9 ' + year + ' TechShift';
        },
        fail: function (reason) {
            document.body.classList.add('is-error');
            if (reason) document.getElementById('errorReason').textContent = reason;
        }
    };

    document.getElementById('retryBtn').addEventListener('click', function () {
        if (window.desktop) window.desktop.retry();
    });
    document.getElementById('logsBtn').addEventListener('click', function () {
        if (window.desktop) window.desktop.openLogs();
    });
    detailsLink.addEventListener('click', function () {
        if (window.desktop) window.desktop.openLogs();
    });
</script>
</body>
</html>
