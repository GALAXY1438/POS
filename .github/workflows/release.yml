name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 2.0.1). Defaults to package.json."
        required: false
      notes:
        description: "Release notes (one line)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TechShiftPOS-Desktop/package-lock.json

      - name: Download POS runtime
        shell: pwsh
        run: |
          $url = "https://github.com/GALAXY1438/POS/releases/download/runtime-2026-11-21/pos-runtime.zip"
          Invoke-WebRequest -Uri $url -OutFile pos-runtime.zip
          Expand-Archive pos-runtime.zip -DestinationPath . -Force
          Remove-Item pos-runtime.zip

      - name: Set version and notes
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = $env:INPUT_VERSION
          if (-not $v -and $env:REF_NAME -like 'v*') { $v = $env:REF_NAME.Substring(1) }
          $p = 'TechShiftPOS-Desktop/package.json'
          $j = Get-Content $p -Raw | ConvertFrom-Json
          if ($v) { $j.version = $v }
          if ($env:INPUT_NOTES) {
            $j.build | Add-Member -NotePropertyName releaseInfo -NotePropertyValue ([pscustomobject]@{ releaseNotes = $env:INPUT_NOTES }) -Force
          }
          $j | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding UTF8
          Write-Output "Building version $($j.version)"

      - name: Install dependencies
        working-directory: TechShiftPOS-Desktop
        run: npm ci

      - name: Build and publish
        working-directory: TechShiftPOS-Desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release
